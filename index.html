<style>
:root{
  --bg:#0b1211; --bg2:#0f1918; --card:#13201e; --card2:#182826; --ink:#e8f1ee; --muted:#93a7a1; --line:#243633;
  --accent:#3fd3b4; --accent2:#7fe0ff; --signal:#f5a54a; --danger:#ff6b6b; --soft:rgba(63,211,180,.12); --shadow:0 30px 60px -30px rgba(0,0,0,.7);
  --display:"Familjen Grotesk",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef3f1; --bg2:#e4ece9; --card:#ffffff; --card2:#f4f8f6; --ink:#10201d; --muted:#53655f; --line:#d3dfdb;
  --accent:#0a8a72; --accent2:#0b6f94; --signal:#b45f00; --danger:#c62828; --soft:rgba(10,138,114,.10); --shadow:0 30px 60px -34px rgba(16,32,29,.35); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef3f1; --bg2:#e4ece9; --card:#ffffff; --card2:#f4f8f6; --ink:#10201d; --muted:#53655f; --line:#d3dfdb;
  --accent:#0a8a72; --accent2:#0b6f94; --signal:#b45f00; --danger:#c62828; --soft:rgba(10,138,114,.10); --shadow:0 30px 60px -34px rgba(16,32,29,.35); color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[v-cloak]{display:none}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.mono{font-family:var(--mono)}
.ok{color:var(--accent)} .w{color:var(--signal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--accent);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;text-decoration:none;transition:top .2s}
.skip:focus{top:12px}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.on{opacity:1;transform:none}

/* progress */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:40;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left;transform:scaleX(0)}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.logo{font-family:var(--mono);font-size:15px;color:var(--ink);text-decoration:none;font-weight:500}
.logo b{color:var(--accent)}
.nav-r{display:flex;align-items:center;gap:6px}
nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0;font-size:14px}
nav ul a{position:relative;display:block;padding:6px 11px;border-radius:8px;color:var(--muted);text-decoration:none;transition:color .2s,background .2s}
nav ul a:hover{color:var(--ink)}
nav ul a.act{color:var(--ink);background:var(--soft)}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.burger{display:none}
@media (max-width:860px){
  .burger{display:inline-grid}
  nav ul{position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:2px;padding:10px max(16px,env(safe-area-inset-left,0px)) 16px;background:var(--bg);border-bottom:1px solid var(--line);
    transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  nav ul.open{opacity:1;transform:none;pointer-events:auto}
  nav ul a{padding:12px;font-size:16px}
}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:120px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.net{position:absolute;inset:0;width:100%;height:100%;opacity:.6}
.hero .in{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center;padding-block:96px 72px;pointer-events:none}
.hero .in > *{pointer-events:auto;min-width:0}
@media (max-width:900px){.hero .in{grid-template-columns:1fr;padding-block:48px 56px}}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(34px,4.8vw,56px);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:8px 0 16px}
.hero .role{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--muted);margin-top:22px}
.hero .role b{color:var(--ink);font-weight:600}
.hero h1 span{display:block;font-size:.58em;line-height:1.15;letter-spacing:-.015em;margin-top:10px;max-width:22ch}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:200% center}}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:54ch}
.lead b{color:var(--ink);font-weight:600}
.erps{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:var(--muted)}
.erps .arrow{color:var(--accent);font-weight:600}
.erps span.bi{border-color:var(--accent);color:var(--accent);font-weight:600}
.erps span{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--card);cursor:pointer;font-family:inherit;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.pri:hover{box-shadow:0 10px 30px -10px var(--accent)}
.btn svg{width:16px;height:16px}

/* terminal */
.term{font-family:var(--mono);font-size:13px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.term .bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.term .bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.term .bar i:nth-child(1){background:#ff5f57}.term .bar i:nth-child(2){background:#febc2e}.term .bar i:nth-child(3){background:#28c840}
.term .bar span{margin-left:8px;color:var(--muted);font-size:12px}
.term .bar em{margin-left:auto;font-style:normal;font-size:11px;color:var(--accent);white-space:nowrap}
.term pre{margin:0;padding:16px;min-height:260px;white-space:pre-wrap;color:var(--muted);line-height:1.7}
.term .c{color:var(--ink)}
.caret{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-block:40px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.kpis{grid-template-columns:1fr}}
.kpi{padding:20px;display:grid;gap:6px;position:relative;overflow:hidden;align-content:start}
.kpi strong{font-family:var(--display);font-size:clamp(30px,4vw,42px);line-height:1;font-variant-numeric:tabular-nums}
.kpi strong.sm{font-size:clamp(22px,2.4vw,27px);line-height:1.15;padding-block:4px}
.kpi span{font-size:14px;color:var(--muted);position:relative}
.kpi svg{position:absolute;right:0;bottom:0;width:60%;height:44px;opacity:.5}
.kpi path{stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset 1.6s var(--ease) .2s}
.kpi.on path{stroke-dashoffset:0}

section{padding-block:64px}
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.sh h2{font-size:clamp(28px,4vw,42px);margin-top:6px;letter-spacing:-.01em}
.sh p{color:var(--muted);max-width:46ch}

/* flow */
.flow{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;list-style:none;padding:0;margin:0;counter-reset:s}
.flow::before{content:"";position:absolute;left:22px;right:22px;top:21px;height:2px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 16px);background-size:32px 2px;animation:flowx 1s linear infinite;opacity:.55}
@keyframes flowx{to{background-position:32px 0}}
@keyframes flowy{to{background-position:0 32px}}
.step{position:relative;display:grid;gap:14px;align-content:start;min-width:0}
.step .num{position:relative;z-index:1;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--accent);color:var(--accent);box-shadow:0 0 0 6px var(--bg)}
.step .num svg{width:20px;height:20px}
.step .sbody{padding:18px;display:grid;gap:8px;align-content:start;height:100%;transition:border-color .3s,transform .3s var(--ease),opacity .7s var(--ease)}
.step .sbody:hover{border-color:var(--accent)}
.step .sbody .k{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.step h3{font-size:18px}
.step p{color:var(--muted);font-size:14px}
.step .tags li{font-size:11px}
@media (max-width:980px){
  .flow{grid-template-columns:1fr;gap:12px}
  .flow::before{left:21px;right:auto;top:22px;bottom:22px;width:2px;height:auto;background:repeating-linear-gradient(180deg,var(--accent) 0 8px,transparent 8px 16px);background-size:2px 32px;animation-name:flowy}
  .step{grid-template-columns:44px 1fr}
}
.fork{position:relative;margin-top:26px;padding-top:30px}
.fork::before{content:"";position:absolute;left:50%;top:0;height:28px;border-left:2px dashed var(--accent);opacity:.55}
.fork-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:6px}
.fork-head .num{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--bg);box-shadow:0 0 0 6px var(--bg)}
.fork-head .num svg{width:20px;height:20px}
.fork-head .k{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
.fork-head h3{font-size:clamp(18px,2.2vw,22px);margin-top:4px}
.fork-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:30px}
.fork-grid::before{content:"";position:absolute;top:8px;left:16.66%;right:16.66%;border-top:2px dashed var(--accent);opacity:.55}
.fork-card{position:relative;padding:18px;display:grid;gap:8px;align-content:start;transition:border-color .3s,transform .3s var(--ease),opacity .7s var(--ease)}
.fork-card::before{content:"";position:absolute;left:50%;top:-22px;height:21px;border-left:2px dashed var(--accent);opacity:.55}
.fork-card:hover{border-color:var(--accent)}
.fork-card .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent)}
.fork-card .ic svg{width:19px;height:19px}
.fork-card h3{font-size:18px}
.fork-card p{color:var(--muted);font-size:14px}
.fork-card .tags li{font-size:11px}
@media (max-width:900px){.fork-grid{grid-template-columns:1fr;padding-top:14px}.fork-grid::before,.fork-card::before{display:none}}
.outcome{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.outcome b{color:var(--ink);font-weight:600}
.outcome span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--soft);color:var(--ink);font-size:13px}
.outcome span::before{content:"✓";color:var(--accent);font-weight:700}
.outcome{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.outcome b{grid-column:1/-1;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.outcome span{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;padding:12px 16px;border-radius:12px;line-height:1.35}
@media (max-width:900px){.outcome{grid-template-columns:1fr}.outcome span{justify-content:flex-start;text-align:left}}

/* projects */
.proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media (max-width:820px){.proj-grid{grid-template-columns:1fr}}
.proj{position:relative;padding:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s,opacity .7s var(--ease);min-width:0}
.proj.on:hover,.proj.on:focus-within{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow)}
.proj-hit{position:absolute;inset:0;z-index:2;background:none;border:0;cursor:pointer;border-radius:14px}
.pbody{padding:22px;display:grid;gap:12px;align-content:start}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.proj h3{font-size:22px}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.status.live{background:var(--accent);color:var(--bg)}
.pbody p{color:var(--muted);font-size:15px}
.more{font-family:var(--mono);font-size:13px;color:var(--accent);display:inline-flex;gap:6px;align-items:center}
.more i{font-style:normal;transition:transform .25s var(--ease)}
.proj:hover .more i{transform:translateX(4px)}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.tags li{font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:2px 9px;border-radius:6px;color:var(--muted)}

/* illustrative screens */
.screen{background:var(--card2);border-bottom:1px solid var(--line);height:280px;display:grid;grid-template-rows:auto 1fr;min-width:0}
.chrome{display:flex;align-items:center;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em}
.chrome i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.chrome span{margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrome em{margin-left:auto;font-style:normal;padding:1px 6px;border:1px solid var(--line);border-radius:4px;font-size:9px}
.stage{position:relative;padding:14px;min-height:0;overflow:hidden;
  background-image:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px);background-size:22px 22px}
.scr{height:100%;display:grid;gap:8px;min-height:0;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;min-height:0;box-shadow:0 6px 18px -12px rgba(0,0,0,.5)}
.panel small,.ph{display:block;font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.panel b{font-family:var(--display);font-size:18px;line-height:1.2}
.prow{display:flex;gap:8px;min-width:0}
.prow > *{flex:1}
.proj:not(.on) .anim, .proj:not(.on) .anim *{animation-play-state:paused!important}

/* sentiment */
.sent{grid-template-columns:1.5fr 1fr;gap:10px}
.bmap{display:grid;grid-template-rows:auto 1fr auto;gap:6px;min-height:0;padding:10px 12px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.hichip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;padding:2px 7px;border-radius:99px;background:var(--soft)}
.panel .hichip b{font-family:var(--mono);font-size:10px;line-height:1;color:var(--ink);font-weight:600}
.br{width:100%;height:100%;min-height:0;display:block}
.uf{fill:var(--accent);fill-opacity:var(--o);stroke:var(--card);stroke-width:2;stroke-linejoin:round;transition:fill-opacity .5s}
.uf.neu{fill:var(--muted);fill-opacity:.32}
.uf.neg{fill:var(--signal)}
.uf-hl{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;transition:d .4s}
.legend{display:flex;justify-content:center;gap:12px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend span{white-space:nowrap}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c);vertical-align:-1px}
.sent-r{display:grid;gap:10px;grid-template-rows:auto 1fr;min-height:0}
.donut{display:flex;align-items:center;gap:12px;padding:10px 12px}
.donut svg{width:56px;height:56px;flex-shrink:0;transform:rotate(-90deg)}
.donut b{font-size:22px}
.donut small{margin-top:2px}
.tpanel{padding:10px 12px;display:grid;grid-template-rows:auto 1fr;min-height:0}
.topics{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;align-content:start}
.topics li{display:grid;grid-template-columns:1fr 40px 42px;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;white-space:nowrap}
.topics li span{overflow:hidden;text-overflow:ellipsis}
.topics li i{height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.topics li i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent);border-radius:2px;animation:fillw 1.2s var(--ease) both}
.topics li em{font-style:normal;text-align:right}
@keyframes fillw{from{width:0}}
@media (max-width:520px){.sent{grid-template-columns:1.25fr 1fr}.hichip{display:none}.legend{gap:6px;font-size:9px}.legend span::before{width:6px;height:6px;margin-right:3px}.donut{flex-direction:column;justify-content:center;text-align:center;gap:6px}.donut svg{width:46px;height:46px}.donut b{font-size:18px}.sent-r{grid-template-rows:1fr auto}.topics li{grid-template-columns:1fr auto;font-size:10px}.topics li i{display:none}}

/* voice */
.voice{grid-template-rows:auto 1fr auto}
.vbar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.rec{display:inline-flex;align-items:center;gap:5px;color:var(--danger);font-weight:500}
.rec i{width:7px;height:7px;border-radius:50%;background:var(--danger);animation:blink 1.2s steps(1) infinite}
.vbar .plat{margin-left:auto;display:flex;gap:4px}
.vbar .plat b{font-weight:500;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--card)}
.caps{display:grid;gap:6px;align-content:center;min-height:0}
.bubble{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.bubble .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--bg);background:var(--accent)}
.bubble.them .av{background:var(--accent2)}
.bubble .panel{padding:6px 9px}
.bubble .src{font-size:11px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble .dst{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.35;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble .dst .caret{width:6px;height:12px}
.bubble small{display:flex;gap:6px}
.bubble small em{font-style:normal;color:var(--accent)}
.wave{display:flex;align-items:center;gap:2px;height:24px}
.wave i{flex:1;background:var(--accent2);border-radius:2px;animation:wv 1.1s ease-in-out infinite alternate;opacity:.85}
@keyframes wv{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

/* monitor */
.mon{grid-template-rows:auto 1fr auto}
.mon .panel b{font-size:17px}
.chart{display:grid;grid-template-rows:auto 1fr;min-height:0}
.chart .ch{display:flex;justify-content:space-between;align-items:center}
.chart .ch b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent)}
.chart svg{width:100%;height:100%;min-height:0;display:block;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.areaf{opacity:0;animation:fadein .8s 1.2s forwards}
@keyframes fadein{to{opacity:1}}
.ping{animation:ping 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks div{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:10.5px;padding:5px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.checks .scan{animation:scan 2.4s ease-in-out infinite}
@keyframes scan{50%{border-color:var(--signal);box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 18%,transparent)}}

/* erp */
.erp{grid-template-columns:1fr 1fr}
.funnel{display:grid;gap:5px;align-content:start}
.fun{position:relative;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-family:var(--mono);font-size:10.5px;overflow:hidden;background:var(--bg2)}
.fun i{position:absolute;inset:0 auto 0 0;width:var(--w);background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.3;border-radius:5px;animation:fillw 1.1s var(--ease) both}
.fun span,.fun b{position:relative}
.fun b{font-weight:500;color:var(--ink)}
.erp-r{display:grid;grid-template-rows:1fr auto;gap:8px;min-height:0}
.rbars{display:flex;align-items:end;gap:4px;height:calc(100% - 18px);margin-top:4px}
.rbars i{flex:1;background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 20%,transparent));border-radius:3px 3px 0 0;transform-origin:bottom;animation:growy .9s var(--ease) both}
.rbars i.cur{background:linear-gradient(var(--accent2),color-mix(in srgb,var(--accent2) 20%,transparent))}
@keyframes growy{from{transform:scaleY(0)}}
.notif{display:flex;align-items:center;gap:8px;font-size:11px;padding:6px 9px}
.notif i{flex-shrink:0;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-style:normal;font-size:11px}
.notif span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal */
.modal{width:min(680px,calc(100vw - 32px));max-height:calc(100dvh - 48px);padding:0;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);overflow:auto}
.modal::backdrop{background:rgba(5,10,9,.6);backdrop-filter:blur(4px)}
.modal[open]{animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.modal .screen{height:320px;border-radius:18px 18px 0 0}
.mbox{padding:clamp(20px,4vw,32px);display:grid;gap:16px}
.mhead{display:flex;justify-content:space-between;gap:12px;align-items:start}
.mhead h3{font-size:clamp(24px,4vw,30px);margin-top:8px}
.mbox p{color:var(--muted)}
.mbox h4{margin:4px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.mbox ul.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.mbox ul.list li{display:flex;gap:10px;color:var(--ink)}
.mbox ul.list li::before{content:"→";color:var(--accent);font-family:var(--mono)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* cases */
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.cases{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.cases{grid-template-columns:1fr}}
.case{padding:22px;display:grid;gap:10px;align-content:start;transition:border-color .3s,transform .3s var(--ease),opacity .7s var(--ease)}
.case.on:hover{border-color:var(--signal);transform:translateY(-3px)}
.case .k{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--signal);letter-spacing:.06em;text-transform:uppercase}
.case .k b{font-weight:500;color:var(--muted)}
.case h3{font-size:19px}
.case p{color:var(--muted);font-size:15px}

/* timeline */
.gantt{padding:24px;overflow-x:auto}
.gantt svg{display:block;min-width:640px;width:100%;height:auto}
.gantt text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.gantt .gbar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease)}
.gantt .glbl{opacity:0;transition:opacity .5s .9s}
.gantt.on .gbar{transform:none}
.gantt.on .glbl{opacity:1}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:820px){.jobs{grid-template-columns:1fr}}
.job{padding:22px;display:grid;gap:10px;align-content:start;border-top:3px solid var(--c,var(--accent))}
.job .when{font-family:var(--mono);font-size:12px;color:var(--c,var(--accent))}
.job h3{font-size:20px}
.job .org{color:var(--muted);font-size:14px}
.job ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:4px}
.job li::marker{color:var(--c,var(--accent))}

/* stack */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.filters button{font-family:var(--mono);font-size:13px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
.filters button:hover{color:var(--ink);border-color:var(--accent)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.filters button sup{font-size:10px;margin-left:4px;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0;position:relative}
.chip{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;transition:border-color .2s}
.chip:hover{border-color:var(--accent)}
.chip small{display:block;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.chip-move,.chip-enter-active,.chip-leave-active{transition:all .4s var(--ease)}
.chip-enter-from,.chip-leave-to{opacity:0;transform:scale(.9)}
.chip-leave-active{position:absolute}

/* contact */
.contact{padding:clamp(24px,5vw,48px);display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;background:radial-gradient(circle at 0% 0%,var(--soft),transparent 60%),linear-gradient(135deg,var(--card),var(--card2))}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.contact h2{font-size:clamp(28px,4vw,42px)}
.contact p{color:var(--muted);margin-top:10px}
.contact .cta{margin-top:22px}
.cl{display:grid;gap:10px}
.cl > div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);min-width:0}
.cl span{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.cl .acts{display:flex;gap:6px;flex-shrink:0}
.cl button,.cl a.mini-a{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;text-decoration:none;transition:border-color .2s}
.cl button:hover,.cl a.mini-a:hover{border-color:var(--accent)}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:13px}
footer .in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:var(--muted)}

/* toast + top */
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));z-index:60;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.toast-enter-active,.toast-leave-active{transition:all .3s var(--ease)}
.toast-enter-from,.toast-leave-to{opacity:0;transform:translate(-50%,12px)}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50}
.fade-enter-active,.fade-leave-active{transition:opacity .25s,transform .25s}
.fade-enter-from,.fade-leave-to{opacity:0;transform:translateY(8px)}

.noscript{padding:48px 16px;text-align:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.draw{stroke-dashoffset:0}.areaf{opacity:1}}
</style>
</head>

    const draw=()=>{if(++frame%90===1)readColor();x.clearRect(0,0,W,H);const d=140*dpr,md=180*dpr;x.strokeStyle=color;x.fillStyle=color;x.lineWidth=dpr;
      for(const p of P){
        const dx=m.x-p.x,dy=m.y-p.y,r=Math.hypot(dx,dy);if(r<md&&r>1){p.x+=dx/r*.25*dpr;p.y+=dy/r*.25*dpr}
        p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
      for(let i=0;i<P.length;i++){const a=P[i];
        for(let j=i+1;j<P.length;j++){const b=P[j],r=Math.hypot(a.x-b.x,a.y-b.y);if(r<d){x.globalAlpha=(1-r/d)*.45;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
        const rm=Math.hypot(a.x-m.x,a.y-m.y);if(rm<md){x.globalAlpha=(1-rm/md)*.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(m.x,m.y);x.stroke()}}
      x.globalAlpha=.9;for(const p of P){x.beginPath();x.arc(p.x,p.y,1.6*dpr,0,7);x.fill()}
      if(!reduce&&vis&&!document.hidden)raf=requestAnimationFrame(draw);else raf=0};
    const start=()=>{if(!raf&&!reduce&&vis&&!document.hidden)raf=requestAnimationFrame(draw)};
    const move=e=>{const r=c.value.getBoundingClientRect();m.x=(e.clientX-r.left)*dpr;m.y=(e.clientY-r.top)*dpr};
    const leave=()=>{m.x=m.y=-1e5};
    let rt;const onResize=()=>{clearTimeout(rt);rt=setTimeout(size,150)};
    const mo=new MutationObserver(()=>{readColor();if(reduce)draw()});
    onMounted(()=>{x=c.value.getContext('2d');readColor();size();start();host=c.value.parentElement;
      host.addEventListener('pointermove',move);host.addEventListener('pointerleave',leave);addEventListener('resize',onResize);
      document.addEventListener('visibilitychange',start);mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
      if('IntersectionObserver' in window){ob=new IntersectionObserver(([e])=>{vis=e.isIntersecting;start()});ob.observe(c.value)}});
    onBeforeUnmount(()=>{cancelAnimationFrame(raf);ob&&ob.disconnect();mo.disconnect();removeEventListener('resize',onResize);document.removeEventListener('visibilitychange',start)});
    return{c}}};

const PipelineTerm={template:'#t-term',setup(){
  const L=[['c','$ run integracao --origem erp --destino bi'],['','→ autenticando na API do ERP (OAuth2)…'],['','→ 4 arquivos recebidos via SFTP'],['','→ staging: 1.284.390 linhas em 12 partições'],['','→ validando tipos, chaves e duplicidades'],['w','! 37 registros com loja inválida → quarentena'],['','→ BulkMerge em vendas e estoque'],['ok','✓ estoque loja a loja atualizado'],['ok','✓ alocação e OTB recalculados'],['ok','✓ Power BI, dashboards web e relatórios atualizados'],['','→ laudo da quarentena anexado ao chamado']];
  const n=ref(reduce?L.length:0);let t;
  const tick=()=>{if(n.value<L.length){n.value++;t=setTimeout(tick,n.value===1?700:480)}else t=setTimeout(()=>{n.value=0;tick()},4500)};
  onMounted(()=>{if(!reduce)t=setTimeout(tick,600)});onBeforeUnmount(()=>clearTimeout(t));
  return{shown:computed(()=>L.slice(0,n.value)),done:computed(()=>n.value===L.length)}}};

const ScrSentiment={template:'#t-sent',setup(){
  const states=BR_MAP.s.map(s=>{const p=s.p;const cls=p>=53?'':p>=45?'neu':'neg';
    const o=cls===''?(.38+(p-53)/26).toFixed(2):cls==='neu'?.45:(.5+(45-p)/20).toFixed(2);return{...s,cls,o}});
  const order=['BA','SP','PE','RJ','MG','AM','RS','CE','DF','PA'].map(u=>states.find(s=>s.uf===u));
  const k=ref(0);let t;
  onMounted(()=>{if(!reduce)t=setInterval(()=>{k.value=(k.value+1)%order.length},2200)});onBeforeUnmount(()=>clearInterval(t));
  return{vb:BR_MAP.vb,states,hi:computed(()=>order[k.value]),
    segs:[{c:'var(--accent)',v:62,o:0},{c:'var(--muted)',v:23,o:-62},{c:'var(--signal)',v:15,o:-85}],
    topics:[{n:'#mobilidade',w:86,up:1,v:'18%'},{n:'#saúde',w:64,up:0,v:'7%'},{n:'#segurança',w:52,up:1,v:'4%'}]}}};

const ScrVoice={template:'#t-voice',setup(){
  const lines=[{av:'EU',who:'Você',l:'PT → EN',src:'Podemos revisar o cronograma da entrega?',dst:'Can we review the delivery schedule?'},
               {av:'JD',who:'Participante',l:'EN → PT',src:"Sure, let's start with the data migration.",dst:'Claro, vamos começar pela migração dos dados.'}];
  const total=lines[0].dst.length+lines[1].dst.length;const k=ref(reduce?total:0);const sec=ref(768);let t,c;
  const typed=i=>{const off=i?lines[0].dst.length:0;return lines[i].dst.slice(0,Math.max(0,k.value-off))};
  const cur=computed(()=>k.value>=total?-1:k.value<lines[0].dst.length?0:1);
  const clock=computed(()=>{const s=sec.value;return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')});
  const tick=()=>{if(k.value<total){k.value++;t=setTimeout(tick,k.value===lines[0].dst.length?900:38)}else t=setTimeout(()=>{k.value=0;tick()},3200)};
  onMounted(()=>{if(!reduce){t=setTimeout(tick,800);c=setInterval(()=>sec.value++,1000)}});
  onBeforeUnmount(()=>{clearTimeout(t);clearInterval(c)});
  return{lines,typed,cur,clock,wave:WAVE}}};

let gidN=0;
const ScrMonitor={template:'#t-monitor',setup(){
  const pts=CPU.map((v,i)=>[i/(CPU.length-1)*240,60-v]);
  const line='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  return{line,area:line+' L240 60 L0 60 Z',gid:'cpuG'+(++gidN)}}};

const ScrErp={template:'#t-erp',setup:()=>({
  funnel:[{n:'Leads',v:128,w:100},{n:'Visitas',v:64,w:72},{n:'Propostas',v:22,w:46},{n:'Contratos',v:9,w:26}],
  bars:[42,50,46,58,55,63,60,70,66,78,74,88]})};

const ProjectScreen={template:'#t-screen',props:['p']};
const ProjectCard={template:'#t-project',props:['p','i'],emits:['open']};

const ProjectModal={template:'#t-modal',props:['p'],emits:['close'],setup(props,{emit}){
  const dlg=ref(null);
  watch(()=>props.p,v=>nextTick(()=>{const d=dlg.value;if(!d)return;
    if(v&&!d.open){d.showModal();d.scrollTop=0;document.documentElement.style.overflow='hidden'}
    else if(!v&&d.open){d.close()}
    if(!v)document.documentElement.style.overflow=''}));
  const onBackdrop=e=>{if(e.target===dlg.value)emit('close')};
  return{dlg,onBackdrop}}};

const TimeLine={template:'#t-timeline',props:['jobs'],setup(props){
  const y0=2015,y1=2027,x0=40,x1=740,X=y=>x0+(y-y0)/(y1-y0)*(x1-x0);
  const now=new Date(),today=now.getFullYear()+(now.getMonth()+now.getDate()/31)/12;
  const years=Array.from({length:y1-y0+1},(_,i)=>y0+i);
  const bars=computed(()=>[...props.jobs].sort((a,b)=>a.start[0]-b.start[0]).map(j=>{const s=j.start[0]+(j.start[1]-1)/12,e=j.end?j.end[0]+j.end[1]/12:today;
    return{x:X(s),w:X(e)-X(s),color:j.color,label:j.gantt}}));
  const aria='Linha do tempo: '+props.jobs.map(j=>`${j.role}, ${j.period}`).join('; ');
  return{X,years,bars,today,aria}}};

const StackFilter={template:'#t-stack',props:['stack'],setup(props){
  const sel=ref('Tudo');const groups=['Tudo',...Object.keys(props.stack)];
  const all=Object.entries(props.stack).flatMap(([g,a])=>a.map(t=>({g,t})));
  const visible=computed(()=>sel.value==='Tudo'?all:all.filter(c=>c.g===sel.value));
  const count=g=>g==='Tudo'?all.length:props.stack[g].length;
  return{sel,groups,visible,count}}};

/* ============ APP ============ */
const app=createApp({template:'#t-app',setup(){
  const active=ref(''),progress=ref(0),showTop=ref(false),toast=ref(''),current=ref(null);
  const stored=(()=>{try{return localStorage.getItem('theme')}catch(e){return null}})();
  const theme=ref(stored||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
  const applyTheme=v=>{document.documentElement.dataset.theme=v;document.querySelector('meta[name="theme-color"]').content=v==='dark'?'#0b1211':'#eef3f1'};
  applyTheme(theme.value);
  const toggleTheme=()=>{theme.value=theme.value==='dark'?'light':'dark';applyTheme(theme.value);try{localStorage.setItem('theme',theme.value)}catch(e){}};

  let tt;const say=m=>{toast.value=m;clearTimeout(tt);tt=setTimeout(()=>toast.value='',1800)};
  const copy=async v=>{try{await navigator.clipboard.writeText(v);say('Copiado: '+v)}catch(e){say('Não foi possível copiar')}};
  const openProject=p=>{current.value=p};
  const toTop=()=>scrollTo({top:0,behavior:reduce?'auto':'smooth'});

  let raf=0;const onScroll=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const h=document.documentElement.scrollHeight-innerHeight;
    progress.value=h>0?Math.min(1,scrollY/h):0;showTop.value=scrollY>innerHeight*.9;
    if(scrollY<200)active.value='';
    else if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)active.value='contato'})};
  let so;
  onMounted(()=>{addEventListener('scroll',onScroll,{passive:true});onScroll();
    if('IntersectionObserver' in window){so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)active.value=e.target.id}),{rootMargin:'-45% 0px -50% 0px'});
      DATA.links.forEach(l=>{const s=document.getElementById(l.id);s&&so.observe(s)})}});
  onBeforeUnmount(()=>{removeEventListener('scroll',onScroll);so&&so.disconnect()});

  const totalSkills=Object.values(DATA.stack).reduce((a,b)=>a+b.length,0);
  return{...DATA,active,progress,showTop,toast,current,theme,toggleTheme,copy,openProject,toTop,totalSkills,year:new Date().getFullYear()}}});

app.component('NavBar',NavBar).component('HeroNet',HeroNet).component('PipelineTerm',PipelineTerm)
   .component('ProjectCard',ProjectCard).component('ProjectScreen',ProjectScreen).component('ProjectModal',ProjectModal)
   .component('ScrSentiment',ScrSentiment).component('ScrVoice',ScrVoice).component('ScrMonitor',ScrMonitor).component('ScrErp',ScrErp)
   .component('TimeLine',TimeLine).component('StackFilter',StackFilter)
   .directive('reveal',vReveal).directive('count',vCount);
app.mount('#app');
</script>
